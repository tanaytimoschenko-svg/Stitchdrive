<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="img logo/favicon (3).ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="wrap">
    <canvas id="logoCanvas"></canvas>
  </div>

  <script>
    // canvas и контекст
    const canvas = document.getElementById('logoCanvas');
    const ctx = canvas.getContext('2d');

    // Цвета 
    const COLOR1 = '#3EB3D2';
    const COLOR2 = '#2C5C8C';
    const BG = '#0b131c';
    const TEXT_COLOR = '#73d3e6';

    // Функция для масштабирования для ретина дисплеев и ресайза
    function resizeCanvas() {
      const dpr = Math.max(window.devicePixelRatio || 1, 1);
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // Отрисовываем в CSS-пикселях
      draw(); // перерисовать
    }

    // Основная функция отрисовки
    function draw() {
      // Очистка
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);

      // Фон 
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      // Центр
      const cx = w / 2;
      const cy = h / 2 - 20; // немного выше центра для текста внизу

      // Параметры квадрата
      const size = Math.min(w, h) * 0.32; // размер рамки
      const half = size / 2;
      const x0 = cx - half;
      const y0 = cy - half;


      const x1 = cx + half;
      const y1 = cy + half;

      // градиент для обводки квадратной рамки и для текста S
      const grad = ctx.createLinearGradient(x0, y0, x1, y1);
      grad.addColorStop(0, COLOR1);
      grad.addColorStop(1, COLOR2);

      // Линии рамки:  эффект "открытого квадрата"
      ctx.lineWidth = Math.max(6, size * 0.04);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = grad;

      // Рисуем три отдельные сегменты ( углы открытыми)
      ctx.beginPath();
      // Верхняя горизонталь: от внутреннего смещения ( небольшой gap слева)
      const gap = size * 0.12;
      ctx.moveTo(x0 + gap, y0);
      ctx.lineTo(x1 - gap * 0.1, y0);
      // Правая вертикаль: от верхней до чуть выше низа
      ctx.moveTo(x1, y0 + gap * 0.1);
      ctx.lineTo(x1, y1 - gap);
      // Нижняя короткая горизонталь: правый нижний сегмент
      ctx.moveTo(x1 - size * 0.28, y1);
      ctx.lineTo(x1 - gap * 0.1, y1);
      // Левая вертикаль: короткий сегмент со смещением вниз ( маленький пробел вверху)
      ctx.moveTo(x0, y0 + gap);
      ctx.lineTo(x0, y1 - gap * 0.25);
      ctx.stroke();

      // буква "S" в центре
      //  размер шрифта относительно квадрата
      const sFontSize = size * 0.6;
      ctx.font = `700 ${sFontSize}px Montserrat, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Доп. градиент для буквы S (вертикальный от центра квадрата)
      const gS = ctx.createLinearGradient(cx, y0, cx, y1);
      gS.addColorStop(0, COLOR1);
      gS.addColorStop(1, COLOR2);
      ctx.fillStyle = gS;

      //  "S"
      ctx.fillText('S', cx, cy - size * 0.03);

      // Подпись: STITCHDRIVE и DRIVE AHEAD
      // STITCHDRIVE — большой разреженный текст
      const brand = 'STITCHDRIVE';
      const small = 'DRIVE AHEAD';

      // Первый ряд (brand) — тонкий и растянутый
      const brandFontSize = Math.min(w, h) * 0.055;
      ctx.font = `500 ${brandFontSize}px Montserrat, sans-serif`;
      ctx.fillStyle = gS;
      //  ручной буквенный рендеринг с кернингом
      const spacing = brandFontSize * 0.18; // межбуквенный трек
      //  общую ширину
      let totalWidth = 0;
      const letters = brand.split('');
      const measures = letters.map(ch => {
        const m = ctx.measureText(ch);
        totalWidth += m.width + spacing;
        return m.width;
      });
      totalWidth -= spacing; // убираем последний spacing

      // Начальная позиция
      let startX = cx - totalWidth / 2;
      const baselineY = cy + size * 0.72;

      for (let i = 0; i < letters.length; i++) {
        const ch = letters[i];
        ctx.fillText(ch, startX + measures[i] / 2, baselineY);
        startX += measures[i] + spacing;
      }

      // Второй ряд — маленький подбренд
      const smallFontSize = Math.min(w, h) * 0.035;
      ctx.font = `300 ${smallFontSize}px Montserrat, sans-serif`;
      ctx.fillStyle = COLOR1;
      ctx.textAlign = 'center';
      ctx.fillText(small, cx, baselineY + smallFontSize * 1.6);
    }

    // Отслеживаем ресайз
    window.addEventListener('resize', resizeCanvas);
    // Инициализация
    resizeCanvas();
  </script>
</body>
</html>
